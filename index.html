<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitul Electric Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root{--bg:#0f1117;--surface:#1a1d27;--card:#21253a;--border:#2e3352;--accent:#f5a623;--accent2:#ff6b35;--text:#e8eaf6;--text-muted:#8892b0;--user-bubble:#1e3a5f;--bot-bubble:#21253a;--green:#4ade80;--red:#f87171}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Hind Siliguri','Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,#0f1117 0%,#1a1d27 100%);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .logo-text h1{font-size:17px;font-weight:700;color:var(--text);line-height:1.1}
  .logo-text span{font-size:11px;color:var(--accent);font-weight:500;letter-spacing:.5px}
  .status-badge{display:flex;align-items:center;gap:6px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);padding:5px 12px;border-radius:20px;font-size:12px;color:var(--green);font-weight:500}
  .status-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  main{flex:1;display:flex;flex-direction:column;max-width:800px;width:100%;margin:0 auto;padding:20px 16px 0}
  .product-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--surface);border-radius:14px;border:1px solid var(--border);margin-bottom:16px}
  .chip-label{font-size:11px;color:var(--text-muted);font-weight:500;width:100%;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
  .chip{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
  .chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.08);transform:translateY(-1px)}
  #chat-box{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:12px;min-height:320px;max-height:50vh;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
  #chat-box::-webkit-scrollbar{width:4px}
  #chat-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .msg{display:flex;gap:10px;animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{flex-direction:row-reverse}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;align-self:flex-end}
  .bot-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .user-avatar{background:var(--user-bubble);font-size:14px}
  .bubble{max-width:75%;padding:11px 16px;border-radius:16px;font-size:14.5px;line-height:1.65}
  .bot .bubble{background:var(--bot-bubble);border:1px solid var(--border);border-bottom-left-radius:4px}
  .user .bubble{background:var(--user-bubble);border:1px solid #2a4a7f;border-bottom-right-radius:4px;text-align:right}
  .bubble strong{color:var(--accent)}
  .bubble .price-tag{display:inline-block;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.4);color:var(--accent);padding:2px 10px;border-radius:8px;font-weight:600;font-size:15px;margin-top:4px}
  .typing{display:flex;gap:5px;padding:14px 18px;background:var(--bot-bubble);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;width:fit-content}
  .typing span{width:7px;height:7px;background:var(--text-muted);border-radius:50%;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  .input-area{position:sticky;bottom:0;background:var(--bg);padding:16px 0 20px;border-top:1px solid var(--border)}
  .input-row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 6px 6px 16px;transition:border-color .2s}
  .input-row:focus-within{border-color:var(--accent)}
  #user-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14.5px;font-family:inherit;resize:none;max-height:100px;line-height:1.5;padding:4px 0}
  #user-input::placeholder{color:var(--text-muted)}
  #send-btn{width:42px;height:42px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,opacity .15s}
  #send-btn:hover{transform:scale(1.05)}
  #send-btn:active{transform:scale(.95)}
  #send-btn:disabled{opacity:.4;cursor:not-allowed}
  .input-hint{text-align:center;font-size:11px;color:var(--text-muted);margin-top:8px}
  .order-card{background:linear-gradient(135deg,rgba(245,166,35,.08),rgba(255,107,53,.06));border:1px solid rgba(245,166,35,.35);border-radius:12px;padding:14px;margin-top:8px;font-size:13.5px}
  .order-card .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .order-card .row:last-child{border-bottom:none}
  .order-card .label{color:var(--text-muted)}
  .order-card .val{color:var(--text);font-weight:500}
  footer{text-align:center;padding:12px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border);margin-top:auto}
  footer a{color:var(--accent);text-decoration:none}
  @media(max-width:480px){header{padding:0 14px}.logo-text h1{font-size:15px}.bubble{max-width:88%;font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-icon">&#9889;</div>
    <div class="logo-text">
      <h1>Mitul Electric Shop</h1>
      <span>AI Sales Assistant</span>
    </div>
  </div>
  <div class="status-badge"><div class="status-dot"></div>&#2438;&#2472;&#2482;&#2494;&#2439;&#2472;</div>
</header>
<main>
  <div class="product-chips">
    <div class="chip-label">&#128722; &#2470;&#2509;&#2480;&#2497;&#2468; &#2437;&#2480;&#2509;&#2465;&#2494;&#2480; &#2453;&#2480;&#2497;&#2472;</div>
    <button class="chip" onclick="quickSend('&#2475;&#2509;&#2479;&#2494;&#2472; &#2453;&#2495;&#2472;&#2468;&#2503; &#2458;&#2494;&#2439;')">&#127744; &#2475;&#2509;&#2479;&#2494;&#2472;</button>
    <button class="chip" onclick="quickSend('LED &#2476;&#2494;&#2482;&#2509;&#2476; &#2482;&#2494;&#2455;&#2476;&#2503;')">&#128161; LED &#2476;&#2494;&#2482;&#2509;&#2476;</button>
    <button class="chip" onclick="quickSend('&#2488;&#2497;&#2439;&#2458; &#2476;&#2507;&#2480;&#2509;&#2465; &#2458;&#2494;&#2439;')">&#128268; &#2488;&#2497;&#2439;&#2458; &#2476;&#2507;&#2480;&#2509;&#2465;</button>
    <button class="chip" onclick="quickSend('IPS &#2453;&#2495;&#2472;&#2468;&#2503; &#2458;&#2494;&#2439;')">&#128267; IPS</button>
    <button class="chip" onclick="quickSend('&#2451;&#2479;&#2492;&#2492;&#2494;&#2480;&#2495;&#2434; &#2453;&#2509;&#2479;&#2494;&#2476;&#2482; &#2470;&#2480;&#2453;&#2494;&#2480;')">&#128279; &#2453;&#2509;&#2479;&#2494;&#2476;&#2482;</button>
    <button class="chip" onclick="quickSend('&#2488;&#2494;&#2480;&#2509;&#2453;&#2495;&#2463; &#2476;&#2509;&#2480;&#2503;&#2453;&#2494;&#2480; &#2458;&#2494;&#2439;')">&#9881;&#65039; &#2488;&#2494;&#2480;&#2509;&#2453;&#2495;&#2463; &#2476;&#2509;&#2480;&#2503;&#2453;&#2494;&#2480;</button>
  </div>
  <div id="chat-box"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="user-input" rows="1" placeholder="&#2447;&#2454;&#2494;&#2472;&#2503; &#2482;&#2495;&#2454;&#2497;&#2472; — Bangla, English &#2476;&#2494; Banglish..."></textarea>
      <button id="send-btn" onclick="sendMessage()" title="&#2474;&#2494;&#2464;&#2494;&#2472;">&#10148;</button>
    </div>
    <div class="input-hint">Enter &#2458;&#2494;&#2474;&#2497;&#2472; &#2437;&#2469;&#2476;&#2494; &#2476;&#2494;&#2463;&#2472;&#2503; &#2453;&#2509;&#2482;&#2495;&#2453; &#2453;&#2480;&#2497;&#2472;</div>
  </div>
</main>
<footer>
  &copy; 2025 <a href="#">Mitul Electric Shop</a> &bull; &#2488;&#2453;&#2494;&#2482; &#2528;&#2463;&#2494; &ndash; &#2480;&#2494;&#2468; &#2528;&#2463;&#2494; &bull; &#128222; 01856526263
</footer>
<script>
const N8N_WEBHOOK_URL="https://YOUR-N8N-WEBHOOK-URL/webhook/mitul-electric";
let conversationHistory=[],isWaiting=false;
const SYSTEM_PROMPT=`তুমি Mitul Electric Shop-এর AI Sales Assistant। তোমার নাম "মিতুল AI"।
তুমি Bangla, English এবং Banglish — যেকোনো ভাষায় কথা বুঝতে পারো। গ্রাহক যে ভাষায় কথা বলে সেই ভাষায় উত্তর দেবে।
তোমার কাজ:
১. গ্রাহককে উষ্ণভাবে স্বাগত জানাও
২. কী পণ্য চান তা জিজ্ঞেস করো
৩. পণ্যের দাম ও স্টক তথ্য জানাও
৪. অর্ডার নিতে চাইলে নাম, মোবাইল ও ঠিকানা নাও
৫. সব তথ্য নেওয়ার পর অর্ডার সংক্ষেপ দেখাও
৬. কনফার্ম হলে বলো "ORDER_CONFIRMED: নাম|মোবাইল|ঠিকানা|পণ্য|দাম"
পণ্য তালিকা:
- সিলিং ফ্যান: ১,৮০০-৩,৫০০ টাকা
- টেবিল ফ্যান: ৮০০-১,৫০০ টাকা
- ওয়াল ফ্যান: ১,২০০-২,০০০ টাকা
- LED বাল্ব: ৮০-৩৫০ টাকা
- এনার্জি সেভার: ১২০-৪৫০ টাকা
- IPS/UPS: ৮,০০০-২৫,০০০ টাকা
- সুইচ বোর্ড: ১৫০-৮০০ টাকা
- সকেট/প্লাগ: ৪০-৩০০ টাকা
- ওয়্যারিং ক্যাবল: ৩৫-১২০ টাকা/মিটার
- সার্কিট ব্রেকার/MCB: ৩৫০-২,৫০০ টাকা
- ট্রান্সফর্মার: স্টকে নেই
নিয়ম: সংক্ষিপ্ত ও বন্ধুত্বপূর্ণ ভাষায় কথা বলো। ORDER_CONFIRMED লাইনটি শেষ লাইনে রাখো।`;

function scrollBottom(){const b=document.getElementById("chat-box");setTimeout(()=>b.scrollTop=b.scrollHeight,50)}
function addMsg(role,html){const box=document.getElementById("chat-box"),div=document.createElement("div");div.className="msg "+role;const av=document.createElement("div");av.className="avatar "+(role==="bot"?"bot-avatar":"user-avatar");av.textContent=role==="bot"?"⚡":"👤";const bub=document.createElement("div");bub.className="bubble";bub.innerHTML=html;div.appendChild(av);div.appendChild(bub);box.appendChild(div);scrollBottom();return bub}
function showTyping(){const box=document.getElementById("chat-box"),div=document.createElement("div");div.className="msg bot";div.id="typing-indicator";const av=document.createElement("div");av.className="avatar bot-avatar";av.textContent="⚡";const t=document.createElement("div");t.className="typing";t.innerHTML="<span></span><span></span><span></span>";div.appendChild(av);div.appendChild(t);box.appendChild(div);scrollBottom()}
function removeTyping(){const t=document.getElementById("typing-indicator");if(t)t.remove()}
function formatBotText(text){return text.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/\n/g,"<br>").replace(/(\d[\d,]+ ?[–\-] ?\d[\d,]+ ?টাকা|\d[\d,]+ ?টাকা\/মিটার)/g,'<span class="price-tag">$1</span>')}

async function sendToN8N(data){try{await fetch(N8N_WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({date:new Date().toLocaleString("bn-BD",{timeZone:"Asia/Dhaka"}),name:data.name,phone:data.phone,address:data.address,product:data.product,price:data.price}),mode:"no-cors"})}catch(e){console.warn("n8n error:",e)}}

async function askClaude(userMsg){conversationHistory.push({role:"user",content:userMsg});const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:SYSTEM_PROMPT,messages:conversationHistory})});const data=await response.json();const reply=data.content?.[0]?.text||"দুঃখিত, একটু সমস্যা হয়েছে।";conversationHistory.push({role:"assistant",content:reply});return reply}

async function sendMessage(){const input=document.getElementById("user-input"),btn=document.getElementById("send-btn"),text=input.value.trim();if(!text||isWaiting)return;input.value="";input.style.height="auto";isWaiting=true;btn.disabled=true;addMsg("user",text);showTyping();
try{const reply=await askClaude(text);removeTyping();
if(reply.includes("ORDER_CONFIRMED:")){const parts=reply.split("ORDER_CONFIRMED:")[1].trim().split("|"),d={name:parts[0]?.trim()||"",phone:parts[1]?.trim()||"",address:parts[2]?.trim()||"",product:parts[3]?.trim()||"",price:parts[4]?.trim()||""};addMsg("bot",formatBotText(reply.split("ORDER_CONFIRMED:")[0].trim()));sendToN8N(d);const box=document.getElementById("chat-box"),card=document.createElement("div");card.className="msg bot";card.innerHTML='<div class="avatar bot-avatar">⚡</div><div class="bubble"><div class="order-card"><div class="row"><span class="label">📦 পণ্য</span><span class="val">'+d.product+'</span></div><div class="row"><span class="label">💰 দাম</span><span class="val">'+d.price+'</span></div><div class="row"><span class="label">👤 নাম</span><span class="val">'+d.name+'</span></div><div class="row"><span class="label">📱 মোবাইল</span><span class="val">'+d.phone+'</span></div><div class="row"><span class="label">📍 ঠিকানা</span><span class="val">'+d.address+'</span></div><div class="row"><span class="label">✅ স্ট্যাটাস</span><span class="val" style="color:var(--green)">অর্ডার নিশ্চিত হয়েছে</span></div></div></div>';box.appendChild(card);scrollBottom()}
else{addMsg("bot",formatBotText(reply))}}
catch(e){removeTyping();addMsg("bot","⚠️ সংযোগে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।")}
isWaiting=false;btn.disabled=false;input.focus()}

function quickSend(text){document.getElementById("user-input").value=text;sendMessage()}
document.getElementById("user-input").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,100)+"px"});
document.getElementById("user-input").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
window.addEventListener("load",()=>{setTimeout(()=>{addMsg("bot","আস্সালামু আলাইকুম! 🌟<br><br><strong>Mitul Electric Shop</strong>-এ আপনাকে স্বাগতম!<br><br>আমি আপনার AI সহকারী। আপনি কী কিনতে চান? ফ্যান, বাল্ব, IPS, ক্যাবল — যেকোনো ইলেকট্রিক পণ্যের জন্য আমাকে বলুন। 😊<br><br><em style='color:var(--text-muted);font-size:13px;'>Bangla, English বা Banglish — যেকোনো ভাষায় লিখুন!</em>");conversationHistory.push({role:"assistant",content:"আস্সালামু আলাইকুম! Mitul Electric Shop-এ আপনাকে স্বাগতম!"})},400)});
</script>
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet"/>
<script type="module">
import{createChat}from'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
createChat({webhookUrl:'https://majedul.app.n8n.cloud/webhook/ed525f21-4108-4e09-b149-348e8ea06c85/chat'});
</script>
</body>
</html>
