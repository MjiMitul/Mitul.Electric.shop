<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitul Electric Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #21253a;
    --border: #2e3352;
    --accent: #f5a623;
    --accent2: #ff6b35;
    --text: #e8eaf6;
    --text-muted: #8892b0;
    --user-bubble: #1e3a5f;
    --bot-bubble: #21253a;
    --green: #4ade80;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hind Siliguri', 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0f1117 0%, #1a1d27 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .logo-text h1 {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }

  .logo-text span {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(74, 222, 128, 0.1);
    border: 1px solid rgba(74, 222, 128, 0.3);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--green);
    font-weight: 500;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  /* PRODUCT CHIPS */
  .product-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .chip-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    width: 100%;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(245, 166, 35, 0.08);
    transform: translateY(-1px);
  }

  /* CHAT */
  #chat-box {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 12px;
    min-height: 320px;
    max-height: 50vh;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #chat-box::-webkit-scrollbar { width: 4px; }
  #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    align-self: flex-end;
  }

  .bot-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }

  .user-avatar {
    background: var(--user-bubble);
    font-size: 14px;
  }

  .bubble {
    max-width: 75%;
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.65;
  }

  .bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .user .bubble {
    background: var(--user-bubble);
    border: 1px solid #2a4a7f;
    border-bottom-right-radius: 4px;
    text-align: right;
  }

  .bubble strong { color: var(--accent); }
  .bubble .price-tag {
    display: inline-block;
    background: rgba(245, 166, 35, 0.15);
    border: 1px solid rgba(245, 166, 35, 0.4);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 15px;
    margin-top: 4px;
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 14px 18px;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing span {
    width: 7px;
    height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* INPUT AREA */
  .input-area {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 16px 0 20px;
    border-top: 1px solid var(--border);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--accent);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    resize: none;
    max-height: 100px;
    line-height: 1.5;
    padding: 4px 0;
  }

  #user-input::placeholder { color: var(--text-muted); }

  #send-btn {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, opacity 0.15s;
  }

  #send-btn:hover { transform: scale(1.05); }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .input-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ORDER CARD */
  .order-card {
    background: linear-gradient(135deg, rgba(245,166,35,0.08), rgba(255,107,53,0.06));
    border: 1px solid rgba(245,166,35,0.35);
    border-radius: 12px;
    padding: 14px;
    margin-top: 8px;
    font-size: 13.5px;
  }

  .order-card .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .order-card .row:last-child { border-bottom: none; }
  .order-card .label { color: var(--text-muted); }
  .order-card .val { color: var(--text); font-weight: 500; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 12px;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    margin-top: auto;
  }

  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 480px) {
    header { padding: 0 14px; }
    .logo-text h1 { font-size: 15px; }
    .bubble { max-width: 88%; font-size: 14px; }
  }
</style>
</head>

<script>

const N8N_WEBHOOK_URL = "https://YOUR-N8N-WEBHOOK-URL/webhook/mitul-electric"; // ← আপনার n8n URL দিন

// ─── STATE ────────────────────────────────────────────────
let conversationHistory = [];
let orderData = { date: "", name: "", phone: "", address: "", product: "", price: "" };
let isWaiting = false;

// ─── PRODUCTS DB ──────────────────────────────────────────
const products = {

  "mcb": { price: "৩৫০ – ২,৫০০ টাকা", inStock: true, en: "MCB circuit breaker" },
  "এনার্জি সেভার": { price: "১২০ – ৪৫০ টাকা", inStock: true, en: "energy saver" },
  "সকেট": { price: "৬০ – ৩০০ টাকা", inStock: true, en: "socket" },
  "প্লাগ": { price: "৪০ – ২০০ টাকা", inStock: true, en: "plug" },
  "ট্রান্সফর্মার": { price: "স্টকে নেই", inStock: false, en: "transformer" },
};

// ─── SYSTEM PROMPT ────────────────────────────────────────
const SYSTEM_PROMPT = `তুমি Mitul Electric Shop-এর AI Sales Assistant। তোমার নাম "মিতুল AI"।

তুমি Bangla, English এবং Banglish (বাংলিশ) — যেকোনো ভাষায় কথা বুঝতে পারো এবং উত্তর দিতে পারো। গ্রাহক যে ভাষায় কথা বলে, তুমিও সেই ভাষায় উত্তর দেবে।

তোমার কাজ ধাপে ধাপে:
১. গ্রাহককে উষ্ণভাবে স্বাগত জানাও
২. কী পণ্য চান তা জিজ্ঞেস করো
৩. পণ্যের দাম ও স্টক তথ্য জানাও
৪. অর্ডার নিশ্চিত করতে চাইলে নাম, মোবাইল নম্বর ও ঠিকানা নাও
৫. সমস্ত তথ্য নেওয়ার পর অর্ডার সংক্ষেপ দেখাও এবং কনফার্ম করো
৬. কনফার্ম হলে বলো "ORDER_CONFIRMED: নাম|মোবাইল|ঠিকানা|পণ্য|দাম"

পণ্য তালিকা ও দাম:
- সিলিং ফ্যান: ১,৮০০ – ৩,৫০০ টাকা ✅ স্টকে আছে
- টেবিল ফ্যান: ৮০০ – ১,৫০০ টাকা ✅
- ওয়াল ফ্যান: ১,২০০ – ২,০০০ টাকা ✅
- LED বাল্ব: ৮০ – ৩৫০ টাকা ✅
- এনার্জি সেভার: ১২০ – ৪৫০ টাকা ✅
- IPS/UPS: ৮,০০০ – ২৫,০০০ টাকা ✅
- সুইচ বোর্ড: ১৫০ – ৮০০ টাকা ✅
- সকেট/প্লাগ: ৪০ – ৩০০ টাকা ✅
- ওয়্যারিং ক্যাবল: ৩৫ – ১২০ টাকা/মিটার ✅
- সার্কিট ব্রেকার/MCB: ৩৫০ – ২,৫০০ টাকা ✅
- ট্রান্সফর্মার: ❌ স্টকে নেই

নিয়ম:
- সংক্ষিপ্ত ও বন্ধুত্বপূর্ণ ভাষায় কথা বলো
- দোকানের নাম উল্লেখ করতে পারো: Mitul Electric Shop
- অর্ডার কনফার্মের সময় সব তথ্য সংক্ষেপে দেখাও
- ORDER_CONFIRMED লাইনটি শেষ লাইনে রাখো, মানুষ দেখে না এটি
- ইমোজি ব্যবহার করো পরিমিতভাবে`;

// ─── HELPERS ──────────────────────────────────────────────
function scrollBottom() {
  const box = document.getElementById("chat-box");
  setTimeout(() => box.scrollTop = box.scrollHeight, 50);
}

function addMsg(role, html) {
  const box = document.getElementById("chat-box");
  const div = document.createElement("div");
  div.className = `msg ${role}`;

  const avatar = document.createElement("div");
  avatar.className = `avatar ${role === "bot" ? "bot-avatar" : "user-avatar"}`;
  avatar.textContent = role === "bot" ? "⚡" : "👤";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;

  div.appendChild(avatar);
  div.appendChild(bubble);
  box.appendChild(div);
  scrollBottom();
  return bubble;
}

function showTyping() {
  const box = document.getElementById("chat-box");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typing-indicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar bot-avatar";
  avatar.textContent = "⚡";

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerHTML = "<span></span><span></span><span></span>";

  div.appendChild(avatar);
  div.appendChild(typing);
  box.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById("typing-indicator");
  if (t) t.remove();
}

function formatBotText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/\n/g, "<br>")
    .replace(/(\d[\d,]+ ?– ?\d[\d,]+ ?টাকা|\d[\d,]+ ?টাকা\/মিটার)/g, '<span class="price-tag">$1</span>');
}

// ─── SEND TO n8n ──────────────────────────────────────────
async function sendToN8N(data) {
  try {
    const payload = {
      date: new Date().toLocaleString("bn-BD", { timeZone: "Asia/Dhaka" }),
      name: data.name,
      phone: data.phone,
      address: data.address,
      product: data.product,
      price: data.price,
    };
    await fetch(N8N_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      mode: "no-cors"
    });
    console.log("✅ n8n-এ পাঠানো হয়েছে:", payload);
  } catch (e) {
    console.warn("n8n webhook error:", e);
  }
}

// ─── CLAUDE API CALL ──────────────────────────────────────
async function askClaude(userMsg) {
  conversationHistory.push({ role: "user", content: userMsg });

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: conversationHistory,
    }),
  });

  const data = await response.json();
  const reply = data.content?.[0]?.text || "দুঃখিত, একটু সমস্যা হয়েছে। আবার চেষ্টা করুন।";
  conversationHistory.push({ role: "assistant", content: reply });
  return reply;
}

// ─── MAIN SEND ────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById("user-input");
  const btn = document.getElementById("send-btn");
  const text = input.value.trim();
  if (!text || isWaiting) return;

  input.value = "";
  input.style.height = "auto";
  isWaiting = true;
  btn.disabled = true;

  addMsg("user", text);
  showTyping();

  try {
    const reply = await askClaude(text);
    removeTyping();

    // Check for order confirmed
    if (reply.includes("ORDER_CONFIRMED:")) {
      const parts = reply.split("ORDER_CONFIRMED:")[1].trim().split("|");
      const cleanedData = {
        name: parts[0]?.trim() || "",
        phone: parts[1]?.trim() || "",
        address: parts[2]?.trim() || "",
        product: parts[3]?.trim() || "",
        price: parts[4]?.trim() || "",
      };
      const visibleReply = reply.split("ORDER_CONFIRMED:")[0].trim();
      addMsg("bot", formatBotText(visibleReply));
      sendToN8N(cleanedData);

      // Show success card
      const box = document.getElementById("chat-box");
      const card = document.createElement("div");
      card.className = "msg bot";
      card.innerHTML = `
        <div class="avatar bot-avatar">⚡</div>
        <div class="bubble">
          <div class="order-card">
            <div class="row"><span class="label">📦 পণ্য</span><span class="val">${cleanedData.product}</span></div>
            <div class="row"><span class="label">💰 দাম</span><span class="val">${cleanedData.price}</span></div>
            <div class="row"><span class="label">👤 নাম</span><span class="val">${cleanedData.name}</span></div>
            <div class="row"><span class="label">📱 মোবাইল</span><span class="val">${cleanedData.phone}</span></div>
            <div class="row"><span class="label">📍 ঠিকানা</span><span class="val">${cleanedData.address}</span></div>
            <div class="row"><span class="label">✅ স্ট্যাটাস</span><span class="val" style="color:var(--green)">অর্ডার নিশ্চিত হয়েছে</span></div>
          </div>
        </div>`;
      box.appendChild(card);
      scrollBottom();
    } else {
      addMsg("bot", formatBotText(reply));
    }
  } catch (e) {
    removeTyping();
    addMsg("bot", "⚠️ সংযোগে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।");
  }

  isWaiting = false;
  btn.disabled = false;
  input.focus();
}

function quickSend(text) {
  document.getElementById("user-input").value = text;
  sendMessage();
}

// ─── AUTO-RESIZE TEXTAREA ─────────────────────────────────
document.getElementById("user-input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 100) + "px";
});

document.getElementById("user-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
